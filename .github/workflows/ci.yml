name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (CPU torch for the tiny-LLM tests)
        run: |
          uv venv --python 3.11
          uv export --frozen --extra llm --no-emit-project --no-hashes -o req.txt
          uv pip install "$(grep -E '^torch==' req.txt | cut -d';' -f1 | tr -d ' ')" --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|nvidia-|triton|cuda-)' req.txt > req-cpu.txt
          uv pip install -r req-cpu.txt
          uv pip install -e . --no-deps
      - name: Ruff (lint + format)
        run: |
          uv run --no-sync ruff check . --output-format github
          uv run --no-sync ruff format --check .
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Pytest + coverage
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build light image (no LLM)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: menu:ci
          build-args: WITH_LLM=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v6
      - name: Synthetic bundle
        run: |
          uv venv --python 3.11 && uv pip install -e . && uv run --no-sync python scripts/make_demo_bundle.py ci-artifacts
          chmod -R a+rX ci-artifacts
      - name: Run container and probe the API
        run: |
          docker run -d --name menu -p 7860:7860 -v "$PWD/ci-artifacts:/home/user/artifacts:ro" menu:ci
          for i in $(seq 1 60); do curl -fs localhost:7860/health && break; sleep 2; done
          curl -fs localhost:7860/health | tee health.json
          curl -fs -X POST localhost:7860/v1/classify -H 'content-type: application/json' \
            -d '{"ingredients": ["2 oz gin", "club soda", "1 oz lime juice"]}' | tee classify.json
          grep -q '"dish_type":"Drink"' classify.json
          curl -fs localhost:7860/metrics | grep -q menu_requests_total
          curl -fs localhost:7860/ui/ > /dev/null
      - if: failure()
        run: docker logs menu
