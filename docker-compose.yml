# Local production-like stack: API+UI, Prometheus (scrape + alert rules) and Grafana (provisioned dashboard).
#   docker compose up --build        -> UI http://localhost:7860/ui · Prometheus :9090 · Grafana :3000 (admin/admin)
services:
  app:
    build: .
    image: menu-from-nn:latest
    ports: ["7860:7860"]
    environment:
      MENU_ARTIFACTS_DIR: /home/user/artifacts
      MENU_HF_REPO: ${MENU_HF_REPO:-}
      MENU_HF_REVISION: ${MENU_HF_REVISION:-}
      MENU_LLM_THREADS: ${MENU_LLM_THREADS:-4}
    volumes:
      - ./artifacts:/home/user/artifacts
      - hf-cache:/home/user/.cache/huggingface
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  loadtest:
    image: locustio/locust:2.32.4
    profiles: ["loadtest"]
    depends_on: [app]
    volumes:
      - ./loadtest:/mnt/locust:ro
      - ./reports/perf:/out
    command: >
      -f /mnt/locust/locustfile.py --host http://app:7860 --headless -u 4 -r 1 -t 2m
      --csv /out/local_full --html /out/local_full.html --only-summary

volumes:
  hf-cache:
