[project]
name = "menu-from-nn"
version = "1.0.0"
description = "Menu from Neural Networks: dish-type classification, dish-name generation and recipe RAG served via FastAPI + Gradio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khabibulin Sultan" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.5,<1.8",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gradio>=5.40",
    "prometheus-client>=0.20",
    "huggingface-hub>=0.24",
    "typer>=0.12",
]

[project.optional-dependencies]
# Neural generator + dense retriever. Installed in Docker / Kaggle; tests run without it.
llm = [
    "torch>=2.2",
    "transformers>=4.46",
    "peft>=0.13",
    "safetensors>=0.4",
    "sentence-transformers>=3.0",
]

[project.scripts]
menu = "menu.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
load = ["locust>=2.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menu"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PL"]
ignore = [
    "PLR0913", "PLR0917", "PLR0915", "PLR0912", "PLR2004", "PLR0911", "PLC0415",
    "RUF001", "RUF002", "RUF003",
    "N806",  # ML convention: X, S, P matrices
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"notebooks/**" = ["E501", "PLR0915", "E402", "B018"]  # notebook cells: imports per cell, display expressions
"src/menu/ui/gradio_app.py" = ["E501"]  # Markdown templates

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/menu"]

[[tool.mypy.overrides]]
# heavy ML libraries are typed loosely; treat them as Any instead of fighting their stubs
module = ["torch.*", "transformers.*", "peft.*", "sentence_transformers.*", "pandas.*", "sklearn.*", "scipy.*", "gradio.*"]
follow_imports = "skip"
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "llm: needs torch/transformers (skipped when not installed)",
    "data: needs the real Epicurious bundle in artifacts/ (skipped otherwise)",
]

[tool.coverage.run]
source = ["menu"]
omit = ["src/menu/ui/*"]
