groups:
  - name: menu-service
    rules:
      - alert: HighErrorRate
        expr: sum(rate(menu_requests_total{status="error"}[5m])) / clamp_min(sum(rate(menu_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 5% of requests fail"}

      - alert: SlowGeneration
        expr: histogram_quantile(0.95, sum by (le) (rate(menu_model_latency_seconds_bucket{model="generator"}[10m]))) > 8
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 LLM latency above 8 s"}

      - alert: InputDrift
        expr: menu_drift_alert == 1
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Rolling OOV rate of inputs exceeds the validation baseline (data drift)"}

      - alert: LowConfidenceSpike
        expr: rate(menu_low_confidence_total[30m]) / clamp_min(sum(rate(menu_predicted_class_total[30m])), 1e-9) > 0.3
        for: 30m
        labels: {severity: info}
        annotations: {summary: "Over 30% of classifications are low-confidence"}

      - alert: GeneratorDegraded
        expr: menu_model_loaded{component="generator"} == 0 or absent(menu_model_loaded{component="generator"})
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "LLM not loaded: generation served by the retrieval fallback"}
