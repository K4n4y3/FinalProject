repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: notebook-in-sync
        name: notebook .ipynb generated from .py
        entry: python scripts/py2nb.py notebooks/final_training.py notebooks/final_training.ipynb
        language: system
        files: ^notebooks/final_training\.py$
        pass_filenames: false
